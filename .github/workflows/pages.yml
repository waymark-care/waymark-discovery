name: validate-and-deploy
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install jsonschema
      - run: python scripts/validate_feed.py
  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the site files
        run: |
          mkdir _site && cp -r index.html assets data _site/
          # stamp asset URLs with the commit so browsers never keep a stale stylesheet or script
          V="${GITHUB_SHA::8}"
          sed -i "s#assets/style.css\"#assets/style.css?v=$V\"#; s#assets/app.js\"#assets/app.js?v=$V\"#" _site/index.html
          grep -q "style.css?v=$V" _site/index.html && grep -q "app.js?v=$V" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: d
        uses: actions/deploy-pages@v4
